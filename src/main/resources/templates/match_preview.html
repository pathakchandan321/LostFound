<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Private Match Preview</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="container"><h1>A similar item may exist</h1><p>To protect privacy, the finder identity, exact location, image, description, and identifying details are hidden until verification and administrator approval.</p><dl><dt>Category</dt><dd th:text="${match.foundItem.category}"></dd><dt>Match confidence</dt><dd th:text="${#numbers.formatPercent(match.confidenceScore, 1, 0)}"></dd><dt>Report date</dt><dd th:text="${match.createdAt.toLocalDate()}"></dd></dl><form th:action="@{|/matches/${match.id}/verify|}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button>This might be my item</button></form><a class="back-btn" href="/my-reports">Back to private dashboard</a></div></body></html>
