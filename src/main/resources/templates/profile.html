<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | FindX</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head>
<body class="page-bg"><header class="nav-shell"><nav class="navbar"><a class="brand" href="/home"><span class="brand-mark">F</span><span>FIND<em>X</em><small>LOST TODAY. FOUND TOMORROW.</small></span></a><a class="ghost-button" href="/my-reports">← My dashboard</a></nav></header><main class="form-page"><div class="form-shell"><div class="form-title"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>Your profile</h1><p>Choose a profile picture for your private FindX dashboard.</p></div><section class="glass-card profile-card"><div class="profile-picture"><img th:if="${profile.profileImage != null}" th:src="@{'/private-uploads/' + ${profile.profileImage}}" alt="Your profile picture"><span th:if="${profile.profileImage == null}" th:text="${#strings.substring(profile.username, 0, 1)}">U</span></div><div><h2 th:text="${profile.username}">Username</h2><p th:text="${profile.email}">email</p></div><form th:action="@{/profile/photo}" method="post" enctype="multipart/form-data"><label class="dropzone">Upload profile photo<input type="file" name="image" accept="image/*" required data-image-preview="#profile-preview"><img id="profile-preview" class="image-preview" alt="Selected profile photo preview"></label><button class="gradient-button" type="submit">Save profile picture</button></form></section></div></main></body></html>
