<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>FindX AI Admin Review</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="navbar"><a href="/my-reports">Dashboard</a></div><div class="container"><h1>Administrator approval queue</h1><p>Only cases above the verification threshold appear here. Review the private evidence before releasing information.</p><table><tr><th>Case</th><th>Claimant</th><th>Lost report</th><th>Found report</th><th>AI verification</th><th>Action</th></tr><tr th:each="claim : ${claims}"><td th:text="${claim.id}"></td><td th:text="${claim.claimant.username}"></td><td th:text="${claim.lostItem.itemName}"></td><td th:text="${claim.foundItem.itemName}"></td><td th:text="${#numbers.formatPercent(claim.verificationScore, 1, 0)}"></td><td><form th:action="@{|/admin/claim/${claim.id}/approve|}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button>Approve</button></form><form th:action="@{|/admin/claim/${claim.id}/reject|}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button>Reject</button></form></td></tr></table></div></body></html>
