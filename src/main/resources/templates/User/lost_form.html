<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Report Lost Item</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="navbar"><a href="/my-reports">My private dashboard</a></div><div class="container"><h2>Report a lost item</h2><p>Your report is visible only to you and authorized administrators.</p><form th:action="@{/User/report-lost}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><label>Item name</label><input name="itemName" required><label>Category</label><input name="category" placeholder="e.g. Electronics, Keys, Personal item" required><label>Date and time lost</label><input type="datetime-local" name="occurredAt" required><label>Approximate location</label><input name="location" required><label>Description</label><textarea name="description" required></textarea><label>Photo</label><input type="file" name="image" accept="image/*" required><button>Submit private report</button></form></div></body></html>
