<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report found item | FindX</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head>
<body class="page-bg"><header class="nav-shell"><nav class="navbar"><a class="brand" href="/home"><span class="brand-mark">F</span><span>FIND<em>X</em><small>LOST TODAY. FOUND TOMORROW.</small></span></a><a class="ghost-button" href="/my-reports">← My dashboard</a></nav></header><main class="form-page"><div class="form-shell"><div class="form-title"><p class="eyebrow">PRIVATE REPORT</p><h1>Report a found item</h1><p>Your report stays private. Similar owners receive a secure notification without seeing your details.</p></div><div class="stepper"><span><b>1</b>Item details</span><span><b>2</b>Photo</span><span><b>3</b>Secure matching</span></div><form class="glass-card report-form" th:action="@{/User/report-found}" method="post" enctype="multipart/form-data"><label>Item name<input type="text" name="itemName" placeholder="e.g. Blue water bottle" required></label><label>Found location<input type="text" name="location" placeholder="e.g. Library second floor" required></label><label class="full">Description<textarea name="description" placeholder="Describe the item without publishing sensitive ownership details." required></textarea></label><label class="full dropzone">Add a photo<input type="file" name="image" accept="image/*" required data-image-preview="#found-preview"><img id="found-preview" class="image-preview" alt="Selected image preview"></label><button class="gradient-button" type="submit">Submit private report →</button></form></div></main></body></html>
