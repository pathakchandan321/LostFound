<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Report Found Item</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="navbar"><a href="/my-reports">My private dashboard</a></div><div class="container"><h2>Report a found item</h2><p>Only authorized administrators can see the exact report. Private identifying details are used solely for AI ownership verification.</p><form th:action="@{/User/report-found}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><label>Item name</label><input name="itemName" required><label>Category</label><input name="category" required><label>Date and time found</label><input type="datetime-local" name="occurredAt" required><label>Approximate location</label><input name="location" required><label>Description</label><textarea name="description" required></textarea><label>Private identifying details</label><textarea name="privateDetails" placeholder="Unique marks, contents, serial fragments, or other owner-only details" required></textarea><label>Photo</label><input type="file" name="image" accept="image/*" required><button>Submit private report</button></form></div></body></html>
