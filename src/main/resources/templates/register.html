<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | FindX</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head>
<body class="page-bg auth-page"><div class="auth-layout"><section class="auth-aside"><a class="brand" href="/home"><span class="brand-mark">F</span><span>FIND<em>X</em><small>LOST TODAY. FOUND TOMORROW.</small></span></a><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Help bring things<br>back <span>home.</span></h1><p>Create your account to securely report items and receive notifications only when our system finds a similar report.</p><a class="private-link" href="/home">← Back to home</a></section><main class="glass-card form-card"><h2>Create account</h2><p>It only takes a moment.</p><p class="form-alert error" role="alert" th:if="${error}" th:text="${error}"></p><form th:action="@{/api/register}" method="post"><label for="username">Username</label><div class="input-wrap"><input id="username" type="text" name="username" autocomplete="username" placeholder="Choose a username" required autofocus></div><label for="email">Email address</label><div class="input-wrap"><input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required></div><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" name="password" autocomplete="new-password" placeholder="Create a password" required><button class="password-toggle" type="button" data-password-toggle="#password" aria-label="Show password">◉</button></div><button class="gradient-button" type="submit">Create account <span>→</span></button></form><p class="account-switch">Already have an account? <a href="/api/login">Sign in</a></p></main></div></body></html>
